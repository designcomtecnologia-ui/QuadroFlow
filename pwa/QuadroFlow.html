<style>
:root{--bg:#f4f5f7;--surface:#fff;--panel:#fafbfc;--line:#e1e5e9;--text:#17202a;--muted:#727b84;--gold:#E9BA2D;--danger:#e99a9a;--colw:310px;--gap:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',Arial,sans-serif}body{padding-bottom:42px;overflow-x:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}
.toolbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);min-height:68px;padding:10px 20px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:160px}.brand img{width:30px;height:30px;object-fit:contain;box-shadow:none;filter:none}.brand-name{font-size:20px;font-weight:500;letter-spacing:-.03em}.toolbar-spacer{flex:1}
.btn{border:1px solid #d7dbe0;background:#fff;color:#252b33;border-radius:8px;padding:9px 12px;font-weight:500;transition:.12s ease}.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17202a}.btn.add-top{font-size:14px;font-weight:600;padding:11px 16px}
.board-wrap{position:relative;width:100%}
.board{display:flex;gap:var(--gap);padding:18px 54px 28px;width:100%;min-height:calc(100vh - 110px);overflow-x:auto;overflow-y:visible;scroll-behavior:smooth;scrollbar-width:auto;-ms-overflow-style:none;align-items:flex-start}
.board::-webkit-scrollbar{width:9px;height:9px}.board::-webkit-scrollbar-track{background:var(--bg)}.board::-webkit-scrollbar-thumb{background:var(--bg);border-radius:10px}
.board:not(.has-overflow) .column{flex:1 1 0;width:0;min-width:0}
.board.has-overflow .column{flex:0 0 var(--colw);width:var(--colw);min-width:var(--colw)}
.column{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(18,24,32,.07)}
.colhead{min-height:60px;padding:13px 12px 11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;background:#fff}
.coltitle{flex:1;min-width:0;font-size:18px;font-weight:500;text-align:left;letter-spacing:-.02em;line-height:1.25;cursor:pointer}
.headbtn{width:30px;height:30px;border:0;border-radius:7px;background:#f4f5f6;color:#59616a;box-shadow:none;font-size:16px}
.notes{min-height:170px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}.notes.dragover{outline:2px dashed #aab2ba;outline-offset:-4px}
.note{position:relative;min-height:112px;border-radius:7px;padding:15px 15px 13px;cursor:grab;user-select:none;box-shadow:0 2px 6px rgba(18,24,32,.11)}.note.dragging{opacity:.38}
.note h3{margin:0 58px 8px 0;font-size:17px;font-weight:500;text-align:left;line-height:1.3;letter-spacing:-.01em}.note p{margin:0;font-size:15px;font-weight:300;text-align:left;line-height:1.5;color:#303740;white-space:pre-wrap}
.meta{margin-top:12px;font-size:11px;font-weight:300;color:#4e5862;line-height:1.4}.note-actions{position:absolute;right:7px;top:7px;display:flex;gap:4px}.note-actions button{width:25px;height:25px;border:0;border-radius:7px;background:rgba(255,255,255,.6);color:#4e5862;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1}.note-actions .edit,.note-actions .trash{font-size:14px}.note-actions .trash{transform:scale(.78);transform-origin:center}
.note-media{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.note-media img{width:54px;height:54px;border-radius:6px;object-fit:cover;border:1px solid rgba(0,0,0,.08)}
.note-link{display:inline-block;margin-top:9px;font-size:12px;color:#44566c;text-decoration:underline;word-break:break-all}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:15;width:36px;height:52px;border:1px solid #d7dbe0;border-radius:9px;background:#fff;color:#4b5560;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;box-shadow:none}
.nav-arrow.left{left:10px}.nav-arrow.right{right:10px}.nav-arrow:disabled{opacity:.18;cursor:default}
.footer{position:fixed;left:0;right:0;bottom:0;height:42px;z-index:40;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid var(--line);color:#7a828c;font-size:11px;font-weight:300}
.footer a{color:#59616a;text-decoration:underline;margin-left:4px}
.toast{position:fixed;right:18px;bottom:56px;z-index:120;background:#17202a;color:#fff;padding:11px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:.18s ease}.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;z-index:100}.modal-bg.show{display:flex}
.modal{width:min(94vw,620px);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.2)}
.modal h2{margin:0 0 14px;font-size:20px;font-weight:500}.modal p{font-size:15px;font-weight:300;line-height:1.5;color:#4b5560}
.field{margin:11px 0}.field label{display:block;margin-bottom:5px;font-size:13px;font-weight:500}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ccd2d8;border-radius:8px;outline:none;background:#fff}.field textarea{min-height:120px;resize:vertical}
.attach-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.attach-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:9px}
.attach-item{position:relative;border:1px solid var(--line);border-radius:8px;padding:5px;background:#fafafa}.attach-item img{display:block;width:100%;height:76px;object-fit:cover;border-radius:5px}.attach-item button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(255,255,255,.9);color:#333}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.trash-page{display:none;max-width:1200px;margin:0 auto;padding:26px 20px 50px}.trash-page.show{display:block}.trash-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}.trash-header h2{margin:0;font-size:24px;font-weight:500}
.trash-empty{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;color:var(--muted)}.trash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.trash-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;cursor:pointer;box-shadow:0 2px 7px rgba(18,24,32,.06)}.trash-card h3{margin:0 0 7px;font-size:17px;font-weight:500}.trash-card p{margin:0;color:#4b5560;font-size:14px;font-weight:300;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.detail-view{max-width:800px;margin:0 auto;padding:26px 20px 60px;display:none}.detail-view.show{display:block}.detail-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}.detail-card h2{font-size:24px;font-weight:500;margin:0 0 10px}.detail-card p{font-size:15px;font-weight:300;white-space:pre-wrap;line-height:1.55}.detail-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}.detail-images img{width:100%;height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.detail-link{margin-top:14px}.detail-link a{word-break:break-all;color:#44566c}
@media(max-width:1050px){.board:not(.has-overflow) .column{flex:1 1 calc(50% - 7px);width:auto}.board.has-overflow .column{flex-basis:300px;width:300px;min-width:300px}}
@media(max-width:680px){.toolbar{padding:10px 12px;gap:7px;flex-wrap:wrap}.brand{min-width:auto}.brand-name{font-size:19px}.toolbar-spacer{display:none}.btn{padding:9px 10px}.btn.add-top{font-size:13px}.board{padding:14px 45px 24px;min-height:calc(100vh - 124px)}.board:not(.has-overflow) .column{flex:1 1 100%;width:auto}.board.has-overflow .column{flex-basis:82vw;width:82vw;min-width:82vw}.nav-arrow{width:32px;height:48px;font-size:29px}.nav-arrow.left{left:5px}.nav-arrow.right{right:5px}.footer{font-size:10px}}
@media print{.toolbar,.nav-arrow,.footer,.modal-bg,.trash-page,.detail-view{display:none!important}.board{display:grid!important;grid-template-columns:repeat(2,1fr)!important;overflow:visible!important;padding:0!important}.column{width:auto!important;min-width:0!important;box-shadow:none;break-inside:avoid}.notes{background:#fff}}

/* QUADROFLOW SCROLL FIX */
.board{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:visible!important;width:100%!important;max-width:none!important;scrollbar-width:none!important;-ms-overflow-style:none!important;scroll-behavior:smooth!important;touch-action:pan-x!important}
.board::-webkit-scrollbar{width:9px;height:9px!important}.board::-webkit-scrollbar-track{background:var(--bg)!important}.board::-webkit-scrollbar-thumb{background:var(--bg)!important;border-radius:10px}
.board:not(.has-overflow) .column{flex:1 1 0!important;min-width:0!important;width:auto!important}
.board.has-overflow .column{flex:0 0 clamp(285px,30vw,330px)!important;width:clamp(285px,30vw,330px)!important;min-width:clamp(285px,30vw,330px)!important}
.nav-arrow{z-index:60!important;pointer-events:auto!important;box-shadow:none!important;filter:none!important}

/* QuadroFlow v5 additions */
.filter-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 54px;background:#fff;border-bottom:1px solid var(--line)}
.filter-title{font-size:13px;font-weight:500}.filter-bar input{height:34px;border:1px solid #d7dbe0;border-radius:7px;padding:6px 9px;background:#fff;font-size:13px;min-width:180px}.filter-bar label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#68717b}.filter-bar label input{min-width:135px}
.col-drag{color:#9aa2ab;font-size:18px;cursor:grab;line-height:1}.column-dragging{opacity:.45}.column-target{outline:2px dashed #aab2ba;outline-offset:2px}

@media(max-width:1050px){#board.has-overflow .column{flex:0 0 300px!important;width:300px!important;min-width:300px!important}}

/* FINAL AJUSTES COMBINADOS — SCROLL + FILTRO */

.filter-bar #applyFiltersBtn{font-weight:600}
</style>

<style id="qf-print-v2">
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 12mm 14mm}
  html,body{background:#fff!important}
  body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .toolbar,.board-wrap,.footer,.modal-bg,.qf-side-menu,.qf-filter-drawer,.filter-results,.nav-arrow{display:none!important}
  #printSheet{display:block!important;width:100%;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  #printSheet *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .print-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1f2933;padding-bottom:8px;margin-bottom:14px}
  .print-brand{font-size:22px;font-weight:600;letter-spacing:-.3px}
  .print-subtitle{font-size:11px;color:#68727b;margin-top:2px}
  .print-date{font-size:10px;color:#68727b;text-align:right}
  .print-column{margin:0 0 14px;border:1px solid #d9dde1;border-radius:7px;overflow:hidden;break-inside:auto}
  .print-column-head{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:13px;font-weight:600;border-left:7px solid var(--print-color);background:var(--print-color);color:#26313a}
  .print-column-count{font-size:10px;font-weight:400;opacity:.72;margin-left:auto}
  .print-task{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:start;padding:9px 10px;border-top:1px solid #e3e6e8;background:#fff;break-inside:avoid}
  .print-check{width:14px;height:14px;border:1.5px solid #4d5962;border-radius:2px;margin-top:2px;background:#fff;box-sizing:border-box}
  .print-task-main{min-width:0}
  .print-task-title{font-size:12.5px;font-weight:600;line-height:1.3;color:#202a32}
  .print-task-client{font-size:9.5px;font-weight:300;color:#5d6870;margin-top:2px}
  .print-task-text{font-size:10.5px;line-height:1.35;color:#46515a;margin-top:4px;white-space:pre-wrap}
  .print-task-priority{display:flex;align-items:center;gap:4px;font-size:9px;color:#66717a;white-space:nowrap;padding-top:1px}
  .print-priority-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .print-priority-dot.high{background:#d93a3a}.print-priority-dot.medium{background:#e2b93b}.print-priority-dot.low{background:#55a65a}
  .print-empty{font-size:10px;color:#7a848c;padding:10px}
  .print-footer{margin-top:14px;padding-top:6px;border-top:1px solid #d9dde1;font-size:9px;color:#7a848c;display:flex;justify-content:space-between}
}
</style>

function nextUniqueColor(){const used=usedColors();for(const c of EXTRA_COLORS)if(!used.has(c.toLowerCase()))return c;for(let h=0;h<360;h+=29){const c=`hsl(${h} 72% 81%)`;if(!used.has(c))return c}return '#D8D8D8'}
function normalizeNote(n,c){const out={...n};delete out.project;delete out.tags;out.color=qfQuadrantColor(c);out.images=Array.isArray(out.images)?out.images:[];out.attachments=Array.isArray(out.attachments)?out.attachments:[];for(const img of out.images){if(img?.data&&!out.attachments.some(a=>a?.data===img.data))out.attachments.push({name:img.name||'Imagem',type:img.type||'image/*',data:img.data})}out.urls=Array.isArray(out.urls)?out.urls:[];if(!out.url&&typeof n.url==='string'&&n.url.trim())out.urls=[n.url.trim()];delete out.url;out.client=out.client||'';out.priority=priorityLabel(out.priority)||'Média';out.createdAt=out.createdAt||new Date().toISOString();return out}
function normalize(){

let persistTimer=0;
async function persistNow(){
  const payload={state,archive,trash};
  try{await QFStorage.saveData(payload);}
  catch(e){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));localStorage.setItem(TRASH_KEY,JSON.stringify(trash));}
}
function persist(){clearTimeout(persistTimer);persistTimer=setTimeout(()=>persistNow(),220)}

async function load(){
  let idbData=null, localState=null, localArchive=null, localTrash=null;
  try{ idbData=await QFStorage.getData(); }
  catch(e){ console.warn('Armazenamento compartilhado indisponível',e); }
  try{
    localState=JSON.parse(localStorage.getItem(KEY)||'null');
    localArchive=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'null');
    localTrash=JSON.parse(localStorage.getItem(TRASH_KEY)||'null');
  }catch(e){ console.warn('Armazenamento local indisponível',e); }

  const idbHasBoard=Array.isArray(idbData?.state) && idbData.state.length>0;
  const localHasBoard=Array.isArray(localState) && localState.length>0;

  // Prioridade: banco compartilhado quando realmente contém um quadro.
  // Se o IndexedDB estiver vazio (por exemplo, primeira abertura ou uma versão
  // que criou o banco vazio), recuperamos o quadro anterior do localStorage.
  if(idbHasBoard){
    state=idbData.state;
    archive=Array.isArray(idbData.archive)?idbData.archive:(Array.isArray(localArchive)?localArchive:[]);
    trash=Array.isArray(idbData.trash)?idbData.trash:(Array.isArray(localTrash)?localTrash:[]);
  }else if(localHasBoard){
    state=localState;
    archive=Array.isArray(idbData?.archive)&&idbData.archive.length? idbData.archive : (Array.isArray(localArchive)?localArchive:[]);
    trash=Array.isArray(idbData?.trash)&&idbData.trash.length? idbData.trash : (Array.isArray(localTrash)?localTrash:[]);
  }else{
    state=defaults();
    archive=Array.isArray(idbData?.archive)?idbData.archive:(Array.isArray(localArchive)?localArchive:[]);
    trash=Array.isArray(idbData?.trash)?idbData.trash:(Array.isArray(localTrash)?localTrash:[]);
  }

  normalize();
  try{await QFStorage.migrateAttachments(state,archive,trash);await persistNow();}
  catch(e){console.warn('Migração de anexos não concluída',e)}
  render();processDeliveredTimers()
}

function processDeliveredTimers(){
 let changed=false;const now=Date.now();
 state.forEach(c=>{if(c.status!=='delivered')return;

   if(!n.deliveryDue)n.deliveryDue=addDaysISO(n.deliveredAt||new Date(),2);

 });
 if(!total) html+=`<div class="print-empty">Não há tarefas para imprimir.</div>`;
 html+=`<div class="print-footer"><span>Marque manualmente as tarefas concluídas.</span><span>QuadroFlow</span></div></main>

</body></html>`;

}

<script id="qf-backup-runtime">
(function(){
  'use strict';
  const APP_VERSION='1.1.0';
  const backupBtn=document.getElementById('backupBtn');
  const restoreBtn=document.getElementById('restoreBtn');
  const restoreFile=document.getElementById('restoreFile');
  const helpBtn=document.getElementById('helpBtn');
  function blobToDataUrl(blob){
    return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Falha ao ler arquivo'));r.readAsDataURL(blob);});
  }
  function collectNotes(){
    const all=[]; (Array.isArray(state)?state:[]).forEach(c=>(c.notes||[]).forEach(n=>all.push(n))); (archive||[]).forEach(n=>all.push(n)); (trash||[]).forEach(n=>all.push(n)); return all;
  }
  async function makeBackup(){
    const attachments={};
    for(const n of collectNotes()){
      for(const a of (n.attachments||[])){
        if(!a) continue;
        if(!a.id) a.id='att_backup_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
        if(attachments[a.id]) continue;
        let data=a.data||'';
        if(!data && a.storage==='idb'){
          const blob=await QFStorage.getFile(a.id);
          if(blob) data=await blobToDataUrl(blob);
        }
        if(data) attachments[a.id]={id:a.id,name:a.name||'Arquivo',type:a.type||'application/octet-stream',size:a.size||0,data};
      }
      for(const a of (n.images||[])){
        if(!a) continue;
        if(!a.id) a.id='att_backup_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
        if(attachments[a.id]) continue;
        if(a.data) attachments[a.id]={id:a.id,name:a.name||'Imagem',type:a.type||'image/*',size:0,data:a.data};
      }
    }
    return {format:'QuadroFlow Backup',version:APP_VERSION,createdAt:new Date().toISOString(),state,archive,trash,attachments:Object.values(attachments)};
  }
  function downloadText(filename,text){const blob=new Blob([text],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  backupBtn?.addEventListener('click',async()=>{
    try{
      backupBtn.disabled=true; backupBtn.textContent='Preparando backup…';
      await persistNow();
      const backup=await makeBackup();
      const stamp=new Date().toISOString().slice(0,10);
      downloadText(`QuadroFlow_Backup_${stamp}.json`,JSON.stringify(backup));
      toast('Backup criado com sucesso');
    }catch(e){console.error(e);toast('Não foi possível criar o backup');}
    finally{backupBtn.disabled=false;backupBtn.textContent='⬇ Fazer backup'}
  });
  restoreBtn?.addEventListener('click',()=>restoreFile?.click());
  restoreFile?.addEventListener('change',async()=>{
    const file=restoreFile.files?.[0]; if(!file)return;
    if(!confirm('Restaurar este backup substituirá o quadro, as tarefas entregues e a lixeira atuais. Continuar?')){restoreFile.value='';return;}
    try{
      const raw=await file.text(); const backup=JSON.parse(raw);
      if(backup?.format!=='QuadroFlow Backup' || !Array.isArray(backup.state)) throw new Error('Arquivo de backup inválido');
      if(!Array.isArray(backup.archive)) backup.archive=[]; if(!Array.isArray(backup.trash)) backup.trash=[];
      state=backup.state; archive=backup.archive; trash=backup.trash; normalize();
      if(QFStorage.clearAttachments) await QFStorage.clearAttachments();
      for(const a of (backup.attachments||[])) if(a?.data) await QFStorage.putDataUrl(a.data,{id:a.id,name:a.name,type:a.type});
      await persistNow();
      render(); processDeliveredTimers();
      toast('Backup restaurado com sucesso');
    }catch(e){console.error(e);toast('Backup inválido ou corrompido');}
    finally{restoreFile.value='';}
  });
  helpBtn?.addEventListener('click',()=>{
    showModal(`<h2>Como usar o QuadroFlow</h2><ol class="qf-help-list"><li><strong>Crie uma tarefa:</strong> informe cliente, título, texto, prioridade, links e arquivos.</li><li><strong>Organize:</strong> arraste o post-it para o quadrante correspondente.</li><li><strong>Acompanhe:</strong> use Tarefas, Iniciar, Produção e Resolvida para visualizar o andamento.</li><li><strong>Entregue:</strong> mova a tarefa para Tarefa entregue quando o trabalho sair da operação.</li><li><strong>Encontre:</strong> use Filtro para pesquisar cliente, título, texto, arquivos, links, prioridade ou quadrante.</li><li><strong>Proteja seus dados:</strong> faça backups periodicamente e guarde o arquivo em um local seguro.</li><li><strong>Imprima:</strong> use Imprimir / PDF para gerar uma lista de execução.</li></ol><div class="qf-help-note"><strong>Importante:</strong> o QuadroFlow guarda os dados localmente neste navegador/dispositivo. O backup é a forma recomendada de manter uma cópia externa dos seus dados.</div><div class="modal-actions"><button class="btn primary" id="closeHelp" type="button">Entendi</button></div>`);
    document.getElementById('closeHelp')?.addEventListener('click',closeModal);
  });
})();
</script>
<script id="qf-pwa-runtime">
(function(){
  'use strict';
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installApp');
  const isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  function setInstallVisible(show){ if(installBtn) installBtn.style.display = show ? 'block' : 'none'; }
  if (isStandalone) setInstallVisible(false);
  window.addEventListener('beforeinstallprompt', function(event){
    event.preventDefault();
    deferredInstallPrompt = event;
    setInstallVisible(true);
  });
  if (installBtn) installBtn.addEventListener('click', async function(){
    if(!deferredInstallPrompt){
      if(typeof toast === 'function') toast('No navegador, procure “Instalar QuadroFlow” no menu.');
      return;
    }
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(_){}
    deferredInstallPrompt = null;
    setInstallVisible(false);
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    setInstallVisible(false);
    if(typeof toast === 'function') toast('QuadroFlow instalado com sucesso.');
  });
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js', {scope:'./'}).then(function(reg){
        reg.addEventListener('updatefound', function(){
          const worker = reg.installing;
          if(!worker) return;
          worker.addEventListener('statechange', function(){
            if(worker.state === 'installed' && navigator.serviceWorker.controller){
              if(typeof toast === 'function') toast('Nova versão do QuadroFlow disponível. Recarregue para atualizar.');
            }
          });
        });
      }).catch(function(err){ console.warn('Service Worker não registrado:', err); });
    });
  }
})();
</script>
