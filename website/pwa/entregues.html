<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28A5C6">
<link rel="apple-touch-icon" href="quadroflow-icon-192.png">
<title>QuadroFlow — Tarefas Entregues</title><style>
:root{--bg:#f5f6f8;--line:#dde2e6;--text:#27313a;--brand:#28A5C6;--lilac:#DCCFED}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0}.top img{width:30px;height:30px}.top h1{font-size:20px;margin:0;font-weight:500}.wrap{padding:22px;max-width:1200px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.bar input,.bar select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:var(--lilac);border-radius:12px;padding:16px;min-height:170px}.card h3{margin:0 35px 8px 0;font-size:17px}.card p{margin:0 0 12px;line-height:1.45}.meta{font-size:12px;color:#58636c;margin-top:4px}.actions{margin-top:12px;display:flex;gap:8px}.empty{padding:40px;text-align:center;color:#67727b}.foot{text-align:center;padding:25px;font-size:12px;color:#6b747b}a{color:#245e6e}
@font-face{font-family:'Inter';src:url('./fonts/Inter-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-SemiBold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}</style></head><body><header class="top"><img src="logo-quadroflow.png"><h1>Tarefas Entregues</h1><span style="flex:1"></span><button class="btn" onclick="location.href='QuadroFlow.html'">← Quadro</button><button class="btn" onclick="location.href='lixeira.html'">🗑 Lixeira</button></header><main class="wrap"><div class="bar"><input id="q" placeholder="Filtrar por nome, título, texto, cliente, prioridade, URL, arquivo..."><input id="from" type="date"><input id="to" type="date"><button class="btn primary" id="filter">Filtrar</button><button class="btn" id="clear">Limpar</button></div><div id="grid" class="grid"></div></main><footer class="foot">Desenvolvido por <strong>Lab3w</strong> • Uso gratuito • <a href="https://wa.me/5511990054049?text=seja%20bem-vindo%20como%20posso%20ajuda-lo%3F" target="_blank">Fale conosco</a></footer><script src="qf-storage.js"></script>
<script>
const A='quadrowflow-delivered-v1',T='quadrowflow-trash-v1';let archive=[],trash=[];async function initStorage(){try{const d=await QFStorage.getData();if(Array.isArray(d.archive)||Array.isArray(d.trash)){archive=Array.isArray(d.archive)?d.archive:[];trash=Array.isArray(d.trash)?d.trash:[];return true}}catch(e){}try{archive=JSON.parse(localStorage.getItem(A)||'[]');trash=JSON.parse(localStorage.getItem(T)||'[]')}catch(e){}return false}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{const d=new Date(v);return d.toLocaleDateString('pt-BR')+', '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
function matches(n){const q=(document.getElementById('q').value||'').trim().toLowerCase(),f=document.getElementById('from').value,t=document.getElementById('to').value;const hay=[n.title,n.text,n.client,n.priority,(n.urls||[]).join(' '),(n.attachments||[]).map(x=>x.name).join(' ')].filter(Boolean).join(' ').toLowerCase();const d=new Date(n.archivedAt||n.deliveredAt||n.createdAt).toISOString().slice(0,10);return(!q||hay.includes(q))&&(!f||d>=f)&&(!t||d<=t)}
async function save(){try{await QFStorage.saveData({state:JSON.parse(localStorage.getItem('quadrowflow-v7')||'[]'),archive,trash})}catch(e){localStorage.setItem(A,JSON.stringify(archive));localStorage.setItem(T,JSON.stringify(trash))}}
function render(){const g=document.getElementById('grid'),list=archive.filter(matches).slice().reverse();if(!list.length){g.innerHTML='<div class="empty">Nenhuma tarefa entregue encontrada.</div>';return}g.innerHTML=list.map(n=>`<article class="card"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.client?`<div class="meta">Cliente: ${esc(n.client)}</div>`:''}<div class="meta">Prioridade: ${esc(n.priority||'Média')}</div><div class="meta">Entregue/arquivada em ${dt(n.archivedAt||n.deliveredAt)}</div><div class="meta">Criada em ${dt(n.createdAt)}</div><div class="actions"><button class="btn" data-view="${esc(n.id)}">Ver detalhes</button><button class="btn" data-trash="${esc(n.id)}">🗑 Enviar para a lixeira</button></div></article>`).join('');g.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const n=archive.find(x=>x.id===b.dataset.view);showDetail(n)});g.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>trashItem(b.dataset.trash))}
async function showDetail(n){if(!n)return;const urls=(n.urls||[]).map(u=>u).filter(Boolean);const fileUrls=[];for(const x of (n.attachments||[])){try{const u=await QFStorage.objectUrl(x);fileUrls.push({name:x.name||'Arquivo',url:u})}catch(_){fileUrls.push({name:x.name||'Arquivo',url:''})}}const fileText=fileUrls.filter(x=>x.url).map(x=>`${x.name}: ${x.url}`).join('\n');alert(`Título: ${n.title}\n\n${n.text}\n\nCliente: ${n.client||'-'}\nCriado: ${dt(n.createdAt)}\nArquivado: ${dt(n.archivedAt||n.deliveredAt)}${urls.length?'\n\nURLs: '+urls.join(', '):''}${fileUrls.length?'\n\nArquivos: '+fileUrls.map(x=>x.name).join(', '):''}${fileText?'\n\nPré-visualização técnica disponível no navegador.':''}`)}
function trashItem(id){const i=archive.findIndex(n=>n.id===id);if(i<0)return;if(!confirm('Enviar esta tarefa para a lixeira?'))return;const n=archive.splice(i,1)[0];trash.push({...n,trashAt:new Date().toISOString(),fromColumnTitle:'Tarefa entregue'});save().then(render)}
document.getElementById('filter').onclick=render;document.getElementById('clear').onclick=()=>{q.value='';from.value='';to.value='';render()};initStorage().then(render);
</script><script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.warn));}
</script>
</body></html>
