<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#28A5C6">
<link rel="apple-touch-icon" href="quadroflow-icon-192.png">
<title>QuadroFlow — Lixeira</title><style>
:root{--bg:#f5f6f8;--line:#dde2e6;--text:#27313a;--brand:#28A5C6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0}.top img{width:30px;height:30px}.top h1{font-size:20px;margin:0;font-weight:500}.wrap{padding:22px;max-width:1200px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.bar input{padding:10px;border:1px solid var(--line);border-radius:8px}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{background:#f4d2d2;border-color:#e4a2a2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.card h3{margin:0 35px 8px 0;font-size:17px}.card p{margin:0 0 12px;line-height:1.45}.meta{font-size:12px;color:#58636c}.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:#67727b}.foot{text-align:center;padding:25px;font-size:12px;color:#6b747b}a{color:#245e6e}
@font-face{font-family:'Inter';src:url('./fonts/Inter-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-SemiBold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:'Inter';src:url('./fonts/Inter-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}</style></head><body><header class="top"><img src="logo-quadroflow.png"><h1>Lixeira</h1><span style="flex:1"></span><button class="btn" onclick="location.href='QuadroFlow.html'">← Quadro</button><button class="btn" onclick="location.href='entregues.html'">✓ Tarefas entregues</button></header><main class="wrap"><div class="bar"><input id="q" placeholder="Filtrar por nome, título, texto, cliente, prioridade, URL, arquivo..."><input id="from" type="date"><input id="to" type="date"><button class="btn primary" id="filter">Filtrar</button><button class="btn" id="clear">Limpar</button></div><div id="grid" class="grid"></div></main><footer class="foot">Desenvolvido por <strong>Lab3w</strong> • Uso gratuito • <a href="https://wa.me/5511990054049?text=seja%20bem-vindo%20como%20posso%20ajuda-lo%3F" target="_blank">Fale conosco</a></footer><script src="qf-storage.js"></script>
<script>
const K='quadrowflow-v7',T='quadrowflow-trash-v1',A='quadrowflow-delivered-v1';let state=[],trash=[];async function initStorage(){try{const d=await QFStorage.getData();if(Array.isArray(d.state)||Array.isArray(d.trash)){state=Array.isArray(d.state)?d.state:[];trash=Array.isArray(d.trash)?d.trash:[];return true}}catch(e){}try{state=JSON.parse(localStorage.getItem(K)||'[]');trash=JSON.parse(localStorage.getItem(T)||'[]')}catch(e){}return false}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{const d=new Date(v);return d.toLocaleDateString('pt-BR')+', '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
async function save(){try{await QFStorage.saveData({state,archive:JSON.parse(localStorage.getItem(A)||'[]'),trash})}catch(e){localStorage.setItem(K,JSON.stringify(state));localStorage.setItem(T,JSON.stringify(trash));localStorage.setItem(A,localStorage.getItem(A)||'[]')}}
function matches(n){const q=(document.getElementById('q').value||'').trim().toLowerCase(),f=document.getElementById('from').value,t=document.getElementById('to').value;const hay=[n.title,n.text,n.client,n.priority,(n.urls||[]).join(' '),(n.attachments||[]).map(x=>x.name).join(' ')].filter(Boolean).join(' ').toLowerCase();const d=new Date(n.trashAt||n.createdAt).toISOString().slice(0,10);return(!q||hay.includes(q))&&(!f||d>=f)&&(!t||d<=t)}
function render(){const g=document.getElementById('grid'),list=trash.filter(matches).slice().reverse();if(!list.length){g.innerHTML='<div class="empty">A lixeira está vazia.</div>';return}g.innerHTML=list.map(n=>`<article class="card"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.client?`<div class="meta">Cliente: ${esc(n.client)}</div>`:''}<div class="meta">Excluída em ${dt(n.trashAt)}</div><div class="meta">Origem: ${esc(n.fromColumnTitle||'Quadrante de origem')}</div><div class="actions"><button class="btn" data-back="${esc(n.id)}">Voltar</button><button class="btn danger" data-del="${esc(n.id)}">Excluir</button></div></article>`).join('');g.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>restore(b.dataset.back));g.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeForever(b.dataset.del))}
function restore(id){const i=trash.findIndex(n=>n.id===id);if(i<0)return;const n=trash.splice(i,1)[0];let target=state.find(c=>c.id===n.fromColumnId);if(!target)target=state.find(c=>c.status==='todo')||state[0];if(target){const FIXED_COLORS={todo:'#F6E7A8',start:'#CFE5C5',production:'#C9DDE8',done:'#EBC9D0',delivered:'#DCCFED'};n.color=FIXED_COLORS[target.status]||target.color||'#E8E8E8';delete n.trashAt;delete n.archivedAt;delete n.fromColumnTitle;target.notes=target.notes||[];target.notes.push(n)}save().then(()=>{render();alert('Tarefa restaurada no quadrante de origem disponível. A cor foi recalculada pelo quadrante.')})}
function removeForever(id){const i=trash.findIndex(n=>n.id===id);if(i<0)return;if(!confirm('Excluir definitivamente esta tarefa?'))return;trash.splice(i,1);save().then(render)}
document.getElementById('filter').onclick=render;document.getElementById('clear').onclick=()=>{q.value='';from.value='';to.value='';render()};initStorage().then(render);
</script><script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.warn));}
</script>
</body></html>
